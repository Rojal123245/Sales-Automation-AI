data:
  input_path: "data/retail_store_data_with_real_items.csv"
  output_path: "data/processed/retail_store_data_processed.csv"
  save_dir: "data/model/"
  predictions_path: "data/processed/predictions.csv"

model:
  arima_order: (1,0,0)
  save_path: "models/saved/sales_forecast.pkl"
  # URL to download pre-trained model (replace with your actual URL)
  download_url: "https://example.com/models/sales_forecast.pkl"

features:
  numeric_cols: ["Price", "Total Stock", "Sales", "Stock Left", "Revenue"]
  date_col: "Date"
  target: "Sales"

logging:
  level: "INFO"
  path: "logs/app.log"

# Warehouse automation configuration
automation:
  warehouse:
    base_url: "https://www.walmart.ca/en" # Replace with actual warehouse URL
    timeout: 30
    retry_attempts: 3
    order_endpoint: "/api/v1/orders"
  costco:
    base_url: "https://www.costco.com"
    timeout: 30
    retry_attempts: 3
    search_endpoint: "/search"
  order_settings:
    min_threshold: 10 # Minimum stock level to trigger reorder
    max_delay_days: 7 # Maximum days to wait for delivery
